<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SNSQuizLocker の設定</title>
  <style>
    /* 配色トークンは core/overlay.css と同値（このページは単体で開くため自前に持つ）。
       ライト=学習ノート / ダーク=夜の書斎。OS設定に追従。 */
    :root {
      --k-bg: #eef0ee;
      --k-card: #fdfdfb;
      --k-ink: #333a37;
      --k-sub: #75807a;
      --k-line: #d3d8d2;
      --k-accent: #47806e;
      --k-ok: #2f6b45;
      --k-ng: #b3402e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --k-bg: #16171a;
        --k-card: #1e1f23;
        --k-ink: #d9d6cc;
        --k-sub: #8d897c;
        --k-line: #34353a;
        --k-accent: #b08b52;
        --k-ok: #86c797;
        --k-ng: #e08a7a;
      }
    }
    body {
      margin: 0;
      padding: 16px 18px;
      min-width: 300px;
      background: var(--k-bg);
      color: var(--k-ink);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      font-size: 14px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    h1.second { margin-top: 18px; }
    label.quiz {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: var(--k-card);
      border: 1px solid var(--k-line);
      border-radius: 8px;
      cursor: pointer;
    }
    label.quiz:hover { border-color: var(--k-sub); }
    label.quiz input { accent-color: var(--k-accent); width: 16px; height: 16px; }
    .badge {
      flex: none;
      width: 24px;
      height: 24px;
      box-sizing: border-box;
      border: 2px solid var(--k-accent);
      border-radius: 5px;
      color: var(--k-accent);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .note {
      margin: 12px 2px 0;
      font-size: 12px;
      line-height: 1.7;
      color: var(--k-sub);
    }
    #status {
      min-height: 1.4em;
      margin-top: 8px;
      font-size: 12px;
      color: var(--k-ok);
    }
    #status.err { color: var(--k-ng); }
  </style>
</head>
<body>
  <h1>出題プラグイン</h1>
  <div id="quizList"></div>
  <p class="note">
    複数選択すると、関所ごとにランダムでいずれかが出題されます。<br>
    1ラウンド（3問など）は同じプラグインから出ます。
  </p>
  <h1 class="second">対象SNS</h1>
  <div id="siteList"></div>
  <p class="note">
    YouTube は動画ごと、他のSNSはサイト全体が対象です。<br>
    解除はタブを閉じるまで有効で、開き直すと再度出題されます。
  </p>
  <div id="status"></div>
  <!-- クイズ・サイトの一覧を得るため、基盤と全クイズを読み込む（host は読み込まない） -->
  <script src="core/registry.js"></script>
  <script src="core/ui.js"></script>
  <script src="config.js"></script>
  <script src="core/sites.js"></script>
  <script src="quizzes/koten/passages.js"></script>
  <script src="quizzes/koten/koten.js"></script>
  <script src="quizzes/hyakunin/poems.js"></script>
  <script src="quizzes/hyakunin/hyakunin.js"></script>
  <script src="quizzes/juon/juon.js"></script>
  <script src="quizzes/senritsu/senritsu.js"></script>
  <script src="quizzes/tsume/shogi.js"></script>
  <script src="quizzes/tsume/problems.js"></script>
  <script src="quizzes/tsume/tsume.js"></script>
  <script src="options.js"></script>
</body>
</html>
